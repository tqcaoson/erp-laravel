# docker-compose.yml — theo mục 10.3 của thiết kế.
#
# CHẾ ĐỘ DEV BIND MOUNT: toàn bộ thư mục source trên máy host được mount
# vào container app/queue/scheduler ở /var/www/html, nginx mount ./public.
# Sửa code trên host là chạy ngay, không cần build lại image:
#   - PHP (app/, routes/, config/, resources/views): lưu file là ăn ngay
#     (opcache kiểm tra lại file mỗi request, config/route không cache).
#   - Vue (resources/js): phải build lại asset (npm run build) rồi mới thấy
#     đổi — xem mục "Sửa code khi đang chạy" trong README.
#   - .env: restart app (php-fpm giữ biến môi trường trong bộ nhớ).
#   - composer.json: build lại image + xóa volume vendor (xem README).
# Thư mục vendor/ dùng named volume riêng để bind mount không che mất
# (vendor chỉ có trong image, máy host không cần cài Composer/PHP).
# Thêm service phpmyadmin (profile "tools", cổng 8080) để quản trị DB khi dev.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_app
    restart: unless-stopped
    env_file: .env
    volumes:
      # Bind mount source: sửa trên host, container ăn ngay.
      - .:/var/www/html
      # vendor/ chỉ có trong image — volume riêng để bind mount không che mất.
      # Volume mới được Docker tự điền từ image lúc tạo lần đầu.
      - vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # Entrypoint chạm file /tmp/erp-ready sau khi migrate + seed xong;
    # healthcheck này báo healthy khi file đó đã có, để nginx chỉ bắt đầu
    # phục vụ khi hệ thống đã khởi tạo xong (tránh 502 lúc mới khởi động).
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/erp-ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [erp_net]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    env_file: .env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    depends_on: [app]
    networks: [erp_net]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    depends_on: [app]
    networks: [erp_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Phục vụ file tĩnh trực tiếp từ thư mục public trên host.
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [erp_net]

  mysql:
    image: mysql:8.0
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [erp_net]

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [erp_net]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: erp_phpmyadmin
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on: [mysql]
    networks: [erp_net]

volumes:
  mysql_data:
  redis_data:
  storage_data:
  # vendor/ của image (được điền lúc tạo volume lần đầu). Khi đổi
  # composer.json phải xóa volume này rồi up lại để lấy vendor mới —
  # xem mục "Sửa code khi đang chạy" trong README.
  vendor:

networks:
  erp_net:
    driver: bridge
