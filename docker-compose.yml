# docker-compose.yml — theo mục 10.3 của thiết kế, có 2 điều chỉnh để chạy được thật:
# 1. nginx KHÔNG mount ./public từ máy host (file build nằm trong image).
#    Thay vào đó app copy public sang named volume "public_data" lúc khởi động
#    (xem docker/php/entrypoint.sh), nginx mount volume đó ở chế độ chỉ đọc.
# 2. Thêm service phpmyadmin (profile "tools", cổng 8080) để quản trị DB khi dev.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_app
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
      - public_data:/mnt/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # Entrypoint copy public sang volume rồi mới chạy php-fpm; healthcheck này
    # báo healthy khi file index.php đã có trong volume, để nginx chỉ bắt đầu
    # phục vụ khi nội dung đã sẵn sàng (tránh 403 lúc mới khởi động).
    healthcheck:
      test: ["CMD", "test", "-f", "/mnt/public/index.php"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [erp_net]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=3
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on: [app]
    networks: [erp_net]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage
    depends_on: [app]
    networks: [erp_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [erp_net]

  mysql:
    image: mysql:8.0
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [erp_net]

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [erp_net]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: erp_phpmyadmin
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on: [mysql]
    networks: [erp_net]

volumes:
  mysql_data:
  redis_data:
  storage_data:
  public_data:

networks:
  erp_net:
    driver: bridge
