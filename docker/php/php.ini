; Cấu hình PHP cho ERP trong container.
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
; Dev bind mount: kiểm tra lại file PHP mỗi request để sửa trên host ăn ngay.
; (Production thường đặt validate_timestamps = 0 + reset thủ công cho nhanh hơn.)
